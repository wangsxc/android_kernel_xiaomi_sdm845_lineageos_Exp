name: Build equuleus MIUI12.5 KSU Kernel

# ============================================================
# 目标：为 小米8屏幕指纹版 (equuleus) 的 MIUI 12.5 (Android 10, 内核 4.9.186)
#       编译集成 KernelSU 的内核
#
# 用法：
#   1. Fork 一个空仓库（或任意仓库）
#   2. 把本文件放到 .github/workflows/build.yml
#   3. Actions → Run workflow
#
# 产物：BakaSU-equuleus-MIUI.zip（AnyKernel3 可直接 TWRP 刷）
# ============================================================

on:
  workflow_dispatch:
    inputs:
      ksu_flavor:
        description: "KSU 分支：sukisu(kprobe) 或 bakasu(manual hook)"
        required: true
        default: "sukisu"
        type: choice
        options:
          - sukisu
          - bakasu

env:
  KERNEL_REPO: MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: dipper-q-oss
  DEVICE: equuleus
  DEFCONFIG: equuleus_user_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Install packages (4.9 内核需要老工具)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev python3 python2 cpio zip lz4 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          # 4.9 内核脚本引用了 python（其实是 python2 语法）
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version || true

      - name: Setup KernelSU (SukiSU kprobe 模式)
        if: inputs.ksu_flavor == 'sukisu'
        run: |
          curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          echo "=== drivers/kernelsu ==="
          ls -la drivers/kernelsu/ | head

      - name: Setup KernelSU (BakaSU manual hook 模式)
        if: inputs.ksu_flavor == 'bakasu'
        run: |
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          echo "=== drivers/kernelsu ==="
          ls -la drivers/kernelsu/ | head

      - name: Patch defconfig
        run: |
          DEF=arch/arm64/configs/${{ env.DEFCONFIG }}
          cp "$DEF" "${DEF}.orig"

          # kprobe 模式需要的配置（用 printf 避免 YAML 块缩进问题）
          printf '%s\n' \
            '' \
            '# === KernelSU ===' \
            'CONFIG_KSU=y' \
            'CONFIG_KPROBES=y' \
            'CONFIG_HAVE_KPROBES=y' \
            'CONFIG_KPROBE_EVENTS=y' \
            'CONFIG_KALLSYMS=y' \
            'CONFIG_KALLSYMS_ALL=y' \
            'CONFIG_EXT4_FS=y' >> "$DEF"

          # 4.9 + GCC 11 兼容：关掉会导致编译失败的 stack protector
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' "$DEF" || true
          sed -i 's/^CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' "$DEF" || true

          echo "=== 关键配置确认 ==="
          grep -E 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS_ALL' "$DEF" || true

      - name: Workaround -Werror (GCC 11 对 4.9 的警告变错误)
        run: |
          sed -i 's/-Werror=/-Wno-error=/g' Makefile scripts/Makefile.build
          sed -i 's/-Werror\([^a-zA-Z=-]\)/-Wno-error\1/g' Makefile scripts/Makefile.build
          sed -i 's/-Werror$/-Wno-error/g' Makefile scripts/Makefile.build
          echo "=== 剩余 Werror ==="
          grep -n 'Werror' Makefile scripts/Makefile.build | head -10 || true

      - name: Download toolchain
        run: |
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm

      - name: Build
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=$PWD/gcc-aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$PWD/gcc-arm/bin/arm-linux-androideabi-
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            ${{ env.DEFCONFIG }}

          echo "=== KSU 编译进内核确认 ==="
          grep -E 'CONFIG_KSU=|CONFIG_KPROBES=y' out/.config || true

          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc)

          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          cp out/arch/arm64/boot/Image.gz ak3/ 2>/dev/null || true

          printf '%s\n' \
            "properties() { '" \
            'kernel.string=KernelSU for Xiaomi Mi 8 Pro (equuleus) MIUI 12.5' \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=1' \
            'device.name1=equuleus' \
            "'; }" \
            '' \
            'block=auto' \
            'is_slot_device=auto' \
            'ramdisk_compression=auto' \
            'patch_vbmeta_flag=auto' \
            '' \
            '. tools/ak3-core.sh' \
            'split_boot' \
            'flash_boot' > ak3/anykernel.sh

          cd ak3 && zip -r9 ../BakaSU-${DEVICE}-MIUI.zip . -x '*.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-equuleus-MIUI
          path: BakaSU-${{ env.DEVICE }}-MIUI.zip
          retention-days: 14
