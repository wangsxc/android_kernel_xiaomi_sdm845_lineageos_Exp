name: Build equuleus MIUI SukiSU v3

on:
  workflow_dispatch:

env:
  KERNEL_REPO: MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: dipper-q-oss
  DEVICE: equuleus
  DEFCONFIG: equuleus_user_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev python3 python2 cpio zip lz4 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup SukiSU
        run: |
          curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          ls -la drivers/kernelsu/ | head -20

      - name: Patch defconfig
        run: |
          DEF=arch/arm64/configs/${{ env.DEFCONFIG }}
          cp "$DEF" "${DEF}.orig"
          echo "" >> "$DEF"
          echo "# KernelSU" >> "$DEF"
          echo "CONFIG_KSU=y" >> "$DEF"
          echo "CONFIG_KPROBES=y" >> "$DEF"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEF"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEF"
          echo "CONFIG_KALLSYMS=y" >> "$DEF"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEF"
          echo "CONFIG_EXT4_FS=y" >> "$DEF"
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' "$DEF" || true
          sed -i 's/^CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' "$DEF" || true
          grep -E 'CONFIG_KSU|CONFIG_KPROBES' "$DEF" || true

      - name: Patch 4.9 compat
        run: |
          TYPEDEF='typedef asmlinkage long (*syscall_fn_t)(const struct pt_regs *regs);'

          echo "########## [A] syscalls.h ##########"
          echo "" >> include/linux/syscalls.h
          echo "/* KernelSU 4.9 backport */" >> include/linux/syscalls.h
          echo "$TYPEDEF" >> include/linux/syscalls.h
          tail -4 include/linux/syscalls.h

          echo "########## [B] hook 头文件 ##########"
          for f in drivers/kernelsu/hook/*.h; do
            if [ -f "$f" ] && grep -q "syscall_fn_t" "$f"; then
              { echo "$TYPEDEF"; echo ""; cat "$f"; } > "${f}.patched"
              mv "${f}.patched" "$f"
              echo "patched: $f"
            fi
          done

          echo "########## [C] init.c 原始 278-292 ##########"
          sed -n '278,292p' drivers/kernelsu/core/init.c || true

          echo "########## [C2] 尝试修 init.c:282 空参数列表 ##########"
          LINE282=$(sed -n '282p' drivers/kernelsu/core/init.c)
          echo "原始第 282 行: $LINE282"
          sed -i '282s/()/(void)/' drivers/kernelsu/core/init.c 2>/dev/null || true
          echo "修复后第 282 行: $(sed -n '282p' drivers/kernelsu/core/init.c)"

          echo "########## [C3] 兜底：全文把 K&R 空参数改 (void) ##########"
          grep -n "()" drivers/kernelsu/core/init.c | head -20 || true

          echo "########## [D] 全局确认 typedef ##########"
          grep -rn "typedef.*syscall_fn_t" include/linux/syscalls.h drivers/kernelsu/hook/ | head -5 || true

      - name: Remove Werror
        run: |
          sed -i 's/-Werror=/-Wno-error=/g' Makefile scripts/Makefile.build
          sed -i 's/-Werror\([^a-zA-Z=-]\)/-Wno-error\1/g' Makefile scripts/Makefile.build
          sed -i 's/-Werror$/-Wno-error/g' scripts/Makefile.build
          echo "done"

      - name: Download toolchain
        run: |
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm

      - name: Build
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=$PWD/gcc-aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$PWD/gcc-arm/bin/arm-linux-androideabi-
          export ARCH=arm64
          export SUBARCH=arm64
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          ls -la "${CROSS_COMPILE}nm" "${CROSS_COMPILE}gcc"
          make O=out ARCH=arm64 CC=clang HOSTCFLAGS="-fcommon" HOSTLDFLAGS="-fcommon" ${{ env.DEFCONFIG }}
          grep -E 'CONFIG_KSU=|CONFIG_KPROBES=y' out/.config || true
          make O=out ARCH=arm64 CC=clang HOSTCFLAGS="-fcommon" HOSTLDFLAGS="-fcommon" KCFLAGS="-Wno-error -Wno-unknown-warning-option -fcommon -Wno-strict-prototypes -Wno-deprecated-non-prototype -Wno-implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=deprecated-non-prototype" -j$(nproc) 2>&1 | tee build.log
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "================ BUILD FAILED ================"
            grep -n -i "error" build.log | head -40 || true
            echo "--- tail 40 ---"
            tail -40 build.log
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          echo "properties() { '" > ak3/anykernel.sh
          echo "kernel.string=SukiSU for Xiaomi Mi 8 Pro equuleus MIUI 12.5" >> ak3/anykernel.sh
          echo "do.devicecheck=1" >> ak3/anykernel.sh
          echo "do.modules=0" >> ak3/anykernel.sh
          echo "do.cleanup=1" >> ak3/anykernel.sh
          echo "do.cleanuponabort=1" >> ak3/anykernel.sh
          echo "device.name1=equuleus" >> ak3/anykernel.sh
          echo "'; }" >> ak3/anykernel.sh
          echo "" >> ak3/anykernel.sh
          echo "block=auto" >> ak3/anykernel.sh
          echo "is_slot_device=auto" >> ak3/anykernel.sh
          echo "ramdisk_compression=auto" >> ak3/anykernel.sh
          echo "patch_vbmeta_flag=auto" >> ak3/anykernel.sh
          echo "" >> ak3/anykernel.sh
          echo ". tools/ak3-core.sh" >> ak3/anykernel.sh
          echo "split_boot" >> ak3/anykernel.sh
          echo "flash_boot" >> ak3/anykernel.sh
          cd ak3
          zip -r9 ../SukiSU-equuleus-MIUI-v3.zip .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-equuleus-MIUI-v3
          path: SukiSU-equuleus-MIUI-v3.zip
          retention-days: 14
